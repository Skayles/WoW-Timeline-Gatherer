# --- NSRT phase mappings (domain/encounters.py, data/encounters/*.yaml, services/notes.py)
"phases NSRT approximatives": "approximate NSRT phases"
"phases NSRT non vérifiées": "unverified NSRT phases"
"Aucun mapping vérifié pour ce boss : les numéros de phase WCL sont repris tels quels. Vérifiez en jeu que NSRT change bien de phase aux mêmes moments.": "No verified mapping for this boss: WCL phase numbers are used as they are. Check in game that NSRT changes phase at the same moments."
"NSRT démarre sa phase 1.5 sur le canal Soul Transfer, une dizaine de secondes avant l'intermission WCL, puis la coupe en 1.75 sur une incantation d'add absente de WCL : les reminders placés tard dans l'intermission risquent de ne pas s'afficher.": "NSRT starts its phase 1.5 on the Soul Transfer channel, about ten seconds before the WCL intermission, then splits it into 1.75 on an add cast WCL does not show: reminders late in the intermission may not appear."
"NSRT ne détecte aucune phase sur ce boss.": "NSRT detects no phase on this boss."
"NSRT numérote l'intermission 2.5 et la Stage Three 3.": "NSRT numbers the intermission 2.5 and Stage Three 3."
"NSRT passe à la phase suivante au début de chaque Binding Anguish (l'ordre des explorateurs varie) ; les retours à la phase commune ne changent pas de phase.": "NSRT moves to the next phase at the start of each Binding Anguish (the order of the explorers varies); going back to the shared phase does not change phase."
"NSRT passe à la phase suivante à chaque retour en Stage One (fin d'intermission) ; l'intermission reste dans la phase précédente. Même numérotation que Lorrgs.": "NSRT moves to the next phase on each return to Stage One (end of the intermission); the intermission stays in the previous phase. Same numbering as Lorrgs."
"WCL alterne Sszorak / Howling Maelstrom mais NSRT ne détecte aucune phase.": "WCL alternates Sszorak / Howling Maelstrom but NSRT detects no phase."
"WCL découpe 4 phases mais NSRT ne détecte aucune phase sur ce boss.": "WCL splits 4 phases but NSRT detects no phase on this boss."

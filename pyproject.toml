[project]
name = "wcl-notes"
version = "1.0.0"
description = "Warcraft Logs cast timelines turned into MRT / NSRT raid notes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pydantic>=2.14.1",
    "pyside6-essentials>=6.12.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
wcl-notes = "wcl_notes.__main__:main"
wcl-notes-cli = "wcl_notes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcl_notes"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Qt event handlers must keep their camelCase names (mousePressEvent, wheelEvent…).
"src/wcl_notes/ui/*" = ["N802"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pytest-qt's QtBot helpers are not annotated.
module = ["test_ui"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "graphql-core>=3.3.0",
    "mypy>=2.4.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
